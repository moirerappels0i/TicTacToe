<!-- Simple SVG icon for the tic-tac-toe app -->
<!-- You can convert this to PNG using an online tool or ImageMagick -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Tic-tac-toe grid -->
  <g stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.3">
    <!-- Vertical lines -->
    <line x1="213" y1="96" x2="213" y2="416" />
    <line x1="299" y1="96" x2="299" y2="416" />
    <!-- Horizontal lines -->
    <line x1="96" y1="213" x2="416" y2="213" />
    <line x1="96" y1="299" x2="416" y2="299" />
  </g>
  
  <!-- X symbol -->
  <g stroke="url(#xColor)" stroke-width="24" stroke-linecap="round">
    <line x1="120" y1="120" x2="190" y2="190" />
    <line x1="190" y1="120" x2="120" y2="190" />
  </g>
  
  <!-- O symbol -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="url(#oColor)" stroke-width="24"/>
  
  <!-- X symbol (bottom right) -->
  <g stroke="url(#xColor)" stroke-width="24" stroke-linecap="round">
    <line x1="322" y1="322" x2="392" y2="392" />
    <line x1="392" y1="322" x2="322" y2="392" />
  </g>
</svg>
